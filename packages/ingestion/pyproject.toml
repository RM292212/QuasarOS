[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quasar-ingestion"
version = "1.0.0"
description = "QuasarOS Scientific Data Ingestion & Provider Adapters"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "netCDF4>=1.6.0",
    "pydantic>=2.5.0",
    "quasar-contracts>=1.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "xarray>=2023.1.0",
    "zarr>=2.16.0"
]

[tool.setuptools.packages.find]
where = ["src"]
