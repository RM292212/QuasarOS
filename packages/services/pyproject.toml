[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quasar-services"
version = "1.0.0"
description = "QuasarOS Control Plane and Catalog Services"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "quasar-contracts>=1.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.24.0"
]

[tool.setuptools.packages.find]
where = ["src"]
