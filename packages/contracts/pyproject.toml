[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quasar-contracts"
version = "1.0.0"
description = "QuasarOS Canonical Scientific Schemas and Contracts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5.0",
    "jsonschema>=4.20.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "xarray>=2023.1.0",
    "numpy>=1.24.0"
]

[tool.setuptools.packages.find]
where = ["src"]
